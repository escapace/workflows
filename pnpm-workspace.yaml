allowBuilds:
  esbuild: true
  lefthook: true
  oxc-resolver: true
blockExoticSubdeps: true
childConcurrency: 1
extendNodePath: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@escapace/syncpack-configuration'
  - eslint-config-escapace
  - prettier-config-escapace
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - eslint
  - '@eslint/*'
  - ts-api-utils@2.3.0
  - tinyexec@1.2.2
