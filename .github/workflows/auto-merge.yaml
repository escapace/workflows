on:
  workflow_call:
    inputs:
      merge-strategy:
        default: rebase,squash
        required: false
        type: string
      pr-number:
        required: false
        type: string

# Top-level permissions intentionally disabled.
# Rationale: each job declares a minimal explicit permission profile.
permissions: {}

concurrency:
  cancel-in-progress: false
  group: auto-merge-${{ github.repository }}

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      count: ${{ steps.discover.outputs.count }}
      matrix: ${{ steps.discover.outputs.matrix }}
      merge-strategy: ${{ steps.discover.outputs.merge_strategy }}
    steps:
      - name: discover candidate pull requests
        id: discover
        env:
          INPUT_MERGE_STRATEGY: ${{ inputs.merge-strategy }}
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        uses: actions/github-script@v9
        with:
          script: |
            const mergeStrategyInput = (process.env.INPUT_MERGE_STRATEGY ?? '').trim().toLowerCase() || 'rebase,squash'
            const mergeStrategyTokens = mergeStrategyInput
              .split(',')
              .map((token) => token.trim())
              .filter((token) => token.length > 0)

            if (mergeStrategyTokens.length === 0) {
              core.setFailed('workflow_call input merge-strategy must contain at least one strategy')
              return
            }

            const allowedStrategies = new Set(['squash', 'rebase'])
            const mergeStrategy = []

            for (const strategy of mergeStrategyTokens) {
              if (!allowedStrategies.has(strategy)) {
                core.setFailed(`workflow_call input merge-strategy contains unsupported value '${strategy}'. Allowed values: squash, rebase`)
                return
              }

              if (!mergeStrategy.includes(strategy)) {
                mergeStrategy.push(strategy)
              }
            }

            const input = (process.env.INPUT_PR_NUMBER ?? '').trim()
            const discovered = []

            if (input.length > 0) {
              if (!/^\d+$/.test(input) || Number(input) <= 0) {
                core.setFailed('workflow_call input pr-number must be a positive integer')
                return
              }

              discovered.push(Number(input))
            } else {
              const pulls = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                per_page: 100,
              })

              for (const pull of pulls) {
                if (Number.isInteger(pull.number) && pull.number > 0) {
                  discovered.push(pull.number)
                } else {
                  core.warning(`Skipping invalid PR identifier from discovery output: ${String(pull.number)}`)
                }
              }
            }

            const matrix = { include: discovered.map((prNumber) => ({ pr_number: prNumber })) }

            core.info(`Discovered ${discovered.length} PR(s)`)
            core.setOutput('count', String(discovered.length))
            core.setOutput('matrix', JSON.stringify(matrix))
            core.setOutput('merge_strategy', mergeStrategy.join(','))

  auto-merge:
    if: needs.discover.outputs.count != '0'
    needs:
      - discover
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: fetch pull request head metadata
        id: pr
        env:
          PR_NUMBER: ${{ matrix.pr_number }}
        uses: actions/github-script@v9
        with:
          script: |
            const pullNumber = Number(process.env.PR_NUMBER)
            if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed(`Invalid matrix PR number: ${process.env.PR_NUMBER}`)
              return
            }

            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            })

            core.setOutput('head_ref', pull.head.ref)
            core.setOutput('head_sha', pull.head.sha)
            core.setOutput('auto_merge_enabled', String(pull.auto_merge !== null))

      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

          ref: ${{ steps.pr.outputs.head_ref }}
      - name: evaluate pull request context
        id: context
        uses: escapace/action-context@v0.14.0
        with:
          context-source: pr
          pr-head-ref: ${{ steps.pr.outputs.head_ref }}
          pr-head-sha: ${{ steps.pr.outputs.head_sha }}
          pr-number: ${{ matrix.pr_number }}
          token: ${{ github.token }}
          trusted-bots: |
            renovate[bot]
            dependabot[bot]

      - name: select merge strategy
        id: select_merge_strategy
        env:
          MERGE_STRATEGY_PREFERENCE: ${{ needs.discover.outputs.merge-strategy }}
          PR_AUTHOR_BOT: ${{ steps.context.outputs.pr-author-bot }}
          PR_CONVENTIONAL_COMMITS: ${{ steps.context.outputs.pr-conventional-commits }}
        uses: actions/github-script@v9
        with:
          script: |
            const toBoolean = (value) => String(value ?? '').toLowerCase() === 'true'
            const parsePreference = (value) => String(value ?? '')
              .split(',')
              .map((token) => token.trim().toLowerCase())
              .filter((token) => token.length > 0)

            const availableForState = (state) => {
              switch (state) {
                case 'all':
                  return new Set(['squash', 'rebase'])
                case 'title-only':
                  return new Set(['squash'])
                case 'commits-only':
                  return new Set(['rebase'])
                case 'none':
                  return new Set()
                default:
                  throw new Error(`Unsupported pr-conventional-commits state: ${state}`)
              }
            }

            const preference = parsePreference(process.env.MERGE_STRATEGY_PREFERENCE)
            const isBot = toBoolean(process.env.PR_AUTHOR_BOT)
            const conventionalState = String(process.env.PR_CONVENTIONAL_COMMITS ?? 'none').trim()
            const effectivePreference = isBot ? ['squash', 'rebase'] : preference
            const available = availableForState(conventionalState)

            let selectedStrategy = 'none'

            if (conventionalState !== 'none') {
              for (const strategy of effectivePreference) {
                if (available.has(strategy)) {
                  selectedStrategy = strategy
                  break
                }
              }
            }

            core.setOutput('selected_strategy', selectedStrategy)
            core.setOutput('merge_flag', selectedStrategy === 'none' ? '' : `--${selectedStrategy}`)

      - name: enable auto-merge (queue and non-queue)
        if: |
          steps.pr.outputs.auto_merge_enabled != 'true' &&
          steps.context.outputs.pr-number != '0' &&
          steps.context.outputs.pr-not-draft == 'true' &&
          steps.context.outputs.pr-mergeable == 'true' &&
          steps.context.outputs.pr-commits-trusted == 'true' &&
          steps.context.outputs.pr-review-clear == 'true' &&
          steps.context.outputs.pr-checks-clear == 'true' &&
          steps.context.outputs.pr-merge-state-clear == 'true' &&
          fromJson(steps.context.outputs.pr-last-commit-age-minute) >= 60 &&
          (
            steps.select_merge_strategy.outputs.selected_strategy == 'squash' ||
            steps.select_merge_strategy.outputs.selected_strategy == 'rebase'
          )
        id: enable_auto_merge
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_FLAG: ${{ steps.select_merge_strategy.outputs.merge_flag }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr-number }}
        run: |
          gh pr merge "${PR_NUMBER}" \
            --auto \
            "$MERGE_FLAG" \
            --match-head-commit "${PR_HEAD_SHA}"

      - name: summary
        if: always()
        env:
          AUTO_MERGE_ENABLED_BEFORE: ${{ steps.pr.outputs.auto_merge_enabled }}
          ENABLE_AUTO_MERGE_OUTCOME: ${{ steps.enable_auto_merge.outcome }}
          MERGE_STRATEGY_SELECTED: ${{ steps.select_merge_strategy.outputs.selected_strategy }}
          PR_BASE_REF: ${{ steps.context.outputs.pr-base-ref }}
          PR_CHECKS_CLEAR: ${{ steps.context.outputs.pr-checks-clear }}
          PR_COMMITS_TRUSTED: ${{ steps.context.outputs.pr-commits-trusted }}
          PR_CONVENTIONAL_COMMITS: ${{ steps.context.outputs.pr-conventional-commits }}
          PR_HEAD_REF: ${{ steps.context.outputs.pr-head-ref }}
          PR_LAST_COMMIT_AGE_MINUTE: ${{ steps.context.outputs.pr-last-commit-age-minute }}
          PR_MERGEABLE: ${{ steps.context.outputs.pr-mergeable }}
          PR_MERGE_STATE_CLEAR: ${{ steps.context.outputs.pr-merge-state-clear }}
          PR_NOT_DRAFT: ${{ steps.context.outputs.pr-not-draft }}
          PR_NUMBER_CONTEXT: ${{ steps.context.outputs.pr-number }}
          PR_NUMBER_REQUESTED: ${{ matrix.pr_number }}
          PR_REVIEW_CLEAR: ${{ steps.context.outputs.pr-review-clear }}
          REQUIRED_LAST_COMMIT_AGE_MINUTE: '60'
        uses: actions/github-script@v9
        with:
          script: |
            const toBoolean = (value) => String(value ?? '').toLowerCase() === 'true'
            const toInteger = (value) => {
              const parsed = Number.parseInt(String(value ?? ''), 10)
              return Number.isFinite(parsed) ? parsed : 0
            }

            const isPositiveIntegerString = (value) => /^\d+$/.test(value) && Number(value) > 0

            const prNumberRequested = String(process.env.PR_NUMBER_REQUESTED ?? '').trim()
            const prNumberFromContext = String(process.env.PR_NUMBER_CONTEXT ?? '').trim()
            const contextPrNumberValid = isPositiveIntegerString(prNumberFromContext)
            const requestedPrNumberValid = isPositiveIntegerString(prNumberRequested)

            const prNumber = contextPrNumberValid
              ? prNumberFromContext
              : requestedPrNumberValid
                ? prNumberRequested
                : ''

            const mergeStrategySelected = String(process.env.MERGE_STRATEGY_SELECTED ?? 'none').trim()
            const requiredAgeMinute = toInteger(process.env.REQUIRED_LAST_COMMIT_AGE_MINUTE)
            const lastCommitAgeMinute = toInteger(process.env.PR_LAST_COMMIT_AGE_MINUTE)
            const autoMergeEnabledBefore = toBoolean(process.env.AUTO_MERGE_ENABLED_BEFORE)
            const enableStepOutcome = String(process.env.ENABLE_AUTO_MERGE_OUTCOME ?? 'skipped').toLowerCase()
            const repository = String(process.env.GITHUB_REPOSITORY ?? '')

            const headRef = String(process.env.PR_HEAD_REF ?? '').trim() || 'unknown'
            const baseRef = String(process.env.PR_BASE_REF ?? '').trim() || 'unknown'

            const pullRequestUrl = prNumber ? `https://github.com/${repository}/pull/${prNumber}` : ''

            const checks = [
              {
                label: 'pr context available',
                passed: contextPrNumberValid,
                details: contextPrNumberValid ? '' : `pr-number: ${prNumberFromContext || 'none'}`,
              },
              {
                label: 'not draft',
                passed: toBoolean(process.env.PR_NOT_DRAFT),
                details: '',
              },
              {
                label: 'mergeable',
                passed: toBoolean(process.env.PR_MERGEABLE),
                details: '',
              },
              {
                label: 'commits trusted',
                passed: toBoolean(process.env.PR_COMMITS_TRUSTED),
                details: '',
              },
              {
                label: 'conventional commits',
                passed: mergeStrategySelected === 'squash' || mergeStrategySelected === 'rebase',
                details: '',
              },
              {
                label: 'review clear',
                passed: toBoolean(process.env.PR_REVIEW_CLEAR),
                details: '',
              },
              {
                label: 'checks clear',
                passed: toBoolean(process.env.PR_CHECKS_CLEAR),
                details: '',
              },
              {
                label: 'merge state clear',
                passed: toBoolean(process.env.PR_MERGE_STATE_CLEAR),
                details: '',
              },
              {
                label: 'last commit age',
                passed: lastCommitAgeMinute >= requiredAgeMinute,
                details: lastCommitAgeMinute >= requiredAgeMinute
                  ? `${lastCommitAgeMinute} minutes`
                  : `${lastCommitAgeMinute} < ${requiredAgeMinute} minutes`,
              },
            ]

            const failedChecks = checks.filter((check) => !check.passed)
            const orderedChecks = [...checks].sort((a, b) => {
              if (a.passed === b.passed) return 0
              return a.passed ? 1 : -1
            })

            let decision = 'Blocked'
            let reason = failedChecks.length > 0
              ? `${failedChecks.length} policy check(s) failing.`
              : 'Policy checks passing, but merge was not enabled.'

            if (autoMergeEnabledBefore) {
              decision = 'No change'
              reason = 'Auto-merge already enabled.'
            } else if (failedChecks.length === 0 && enableStepOutcome === 'success') {
              decision = 'Enabled'
              reason = `Auto-merge enabled using ${mergeStrategySelected}.`
            } else if (failedChecks.length === 0 && enableStepOutcome === 'failure') {
              decision = 'Failed'
              reason = 'Enable command failed. See logs.'
            } else if (failedChecks.length === 0 && enableStepOutcome === 'skipped') {
              decision = 'Skipped'
              reason = 'Enable step skipped despite passing checks.'
            }

            const checkRows = [
              [{ data: 'policy check', header: true }, { data: 'status', header: true }],
              ...orderedChecks.map((check) => {
                const details = String(check.details ?? '').trim()
                const baseStatus = check.passed ? 'pass' : 'fail'
                const status = details.length > 0 ? `${baseStatus} (${details})` : baseStatus
                return [check.label, status]
              }),
            ]

            let prValue = prNumber ? `#${prNumber}` : 'unknown'
            if (pullRequestUrl && prNumber) {
              core.summary.emptyBuffer()
              core.summary.addLink(`#${prNumber}`, pullRequestUrl)
              prValue = core.summary.stringify().trim()
              core.summary.emptyBuffer()
            }

            const outcomeRows = [
              ['pr', prValue],
              ['decision', decision],
              ['reason', reason],
            ]

            if (mergeStrategySelected === 'squash' || mergeStrategySelected === 'rebase') {
              outcomeRows.push([mergeStrategySelected, `${headRef} → ${baseRef}`])
            }

            await core.summary.addTable(outcomeRows)
            await core.summary.addEOL()
            await core.summary.addTable(checkRows)
            await core.summary.write()
