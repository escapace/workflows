on:
  workflow_call:
    inputs:
      build-mode:
        description: CodeQL build mode. Defaults to none; use manual or autobuild only in workflows that supply the required build behavior.
        default: none
        required: false
        type: string
      config-file:
        description: Optional repository-relative CodeQL configuration file. When omitted, .github/codeql/codeql-config.yaml is used if present; otherwise generated output directories are ignored by default.
        default: ''
        required: false
        type: string
      languages:
        description: CodeQL language identifier, for example javascript-typescript, python, ruby, or actions.
        required: true
        type: string
      ref:
        description: Git ref to check out for analysis. Prefer the normalized ref from the shared context workflow.
        required: true
        type: string

# Caller permissions are the security upper bound and must include:
# permissions:
#   actions: read
#   contents: read
#   security-events: write
permissions: {}

concurrency:
  cancel-in-progress: false
  group: codeql-${{ github.repository }}-${{ inputs.ref }}

jobs:
  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: codeql init with explicit config file
        if: inputs.config-file != ''
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          build-mode: ${{ inputs.build-mode }}
          config-file: ${{ inputs.config-file }}
          dependency-caching: false
          languages: ${{ inputs.languages }}
          trap-caching: false
      - name: codeql init with canonical config file
        if: inputs.config-file == '' && hashFiles('.github/codeql/codeql-config.yaml') != ''
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          build-mode: ${{ inputs.build-mode }}
          config-file: ./.github/codeql/codeql-config.yaml
          dependency-caching: false
          languages: ${{ inputs.languages }}
          trap-caching: false
      - name: codeql init with default config
        if: inputs.config-file == '' && hashFiles('.github/codeql/codeql-config.yaml') == ''
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          build-mode: ${{ inputs.build-mode }}
          config: |
            paths-ignore:
              - lib/**
              - dist/**
              - build/**
              - coverage/**
              - node_modules/**
              - '**/*.min.js'
          dependency-caching: false
          languages: ${{ inputs.languages }}
          trap-caching: false
      - name: codeql analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
