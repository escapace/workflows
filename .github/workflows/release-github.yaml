on:
  workflow_call:
    inputs:
      changelog:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: github release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          printf '%s' "$RELEASE_CHANGELOG" > changelog.md

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            gh release create "v${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --prerelease \
              --notes-file changelog.md
          else
            gh release create "v${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file changelog.md
          fi
