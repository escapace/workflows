on:
  workflow_call:
    inputs:
      artifact-name:
        default: package
        required: false
        type: string
      codeql-languages:
        default: javascript-typescript
        required: false
        type: string
      enable-artifact-upload:
        default: false
        required: false
        type: boolean
      enable-codecov:
        default: false
        required: false
        type: boolean
      enable-codeql:
        default: false
        required: false
        type: boolean
      enable-github-packages-npm-registry:
        default: false
        required: false
        type: boolean
      enable-github-pages:
        default: false
        required: false
        type: boolean
      enable-test:
        default: true
        required: false
        type: boolean
      github-pages-artifact-name:
        default: github-pages
        required: false
        type: string
      github-pages-path:
        default: ./lib/github-pages
        required: false
        type: string
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: write .npmrc
        if: inputs.enable-github-packages-npm-registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << EOF > "$HOME/.npmrc"
            //npm.pkg.github.com/:_authToken=$GITHUB_TOKEN
            @escapace:registry=https://npm.pkg.github.com
          EOF
      - name: install pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          run_install: false
          version: ${{ inputs.pnpm-version }}
      - name: get pnpm store directory
        id: pnpm-store-path
        run: echo "value=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: pnpm cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store-path.outputs.value }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store
      - name: install dependencies
        run: pnpm install
      - name: build
        run: pnpm run build
      - name: typecheck
        run: pnpm run typecheck
      - name: test
        if: inputs.enable-test
        run: pnpm run test
      - name: codeql init
        if: inputs.enable-codeql
        uses: github/codeql-action/init@v3.29.10
        with:
          build-mode: none
          languages: ${{ inputs.codeql-languages }}
      - name: codeql analysis
        if: inputs.enable-codeql
        uses: github/codeql-action/analyze@v3.29.10
      - name: code coverage
        if: inputs.enable-codecov && inputs.enable-test
        uses: codecov/codecov-action@v5.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: pnpm pack
        if: inputs.enable-artifact-upload
        run: pnpm run pack --version ${{ inputs.version }}
      - name: upload artifact
        if: inputs.enable-artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            **/lib/*.tgz
            !**/node_modules/**
          retention-days: 3
      - name: build github-pages
        if: inputs.enable-github-pages
        run: pnpm run build:github-pages --base "/${GITHUB_REPOSITORY#*/}/"
      - name: upload github-pages
        if: inputs.enable-github-pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ inputs.github-pages-artifact-name }}
          path: ${{ inputs.github-pages-path }}
