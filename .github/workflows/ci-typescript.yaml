on:
  workflow_call:
    inputs:
      artifact-name:
        default: package
        required: false
        type: string
      codeql-languages:
        default: javascript-typescript
        required: false
        type: string
      container-build-required-script-name:
        description: Optional additional package.json scripts gate for build-target container discovery. When non-empty, only packages whose package.json scripts[container-build-required-script-name] is a string are included. When set to '', no additional script gate is applied.
        default: container:build
        required: false
        type: string
      container-dockerfile-name:
        default: Dockerfile
        required: false
        type: string
      container-export-required-script-name:
        description: Optional additional package.json scripts gate for export-target container discovery. When non-empty, only packages whose package.json scripts[container-export-required-script-name] is a string are included. When set to '', no additional script gate is applied.
        default: container:export
        required: false
        type: string
      container-test-required-script-name:
        description: Optional additional package.json scripts gate for test-target container discovery. When non-empty, only packages whose package.json scripts[container-test-required-script-name] is a string are included. When set to '', no additional script gate is applied.
        default: container:test
        required: false
        type: string
      enable-artifact-upload:
        default: false
        required: false
        type: boolean
      enable-codecov:
        default: false
        required: false
        type: boolean
      # Compatibility-only CodeQL path. Prefer .github/workflows/codeql.yaml for new callers so regular CI does not need security-events: write.
      enable-codeql:
        default: false
        required: false
        type: boolean
      enable-github-packages-npm-registry:
        default: false
        required: false
        type: boolean
      enable-github-pages:
        default: false
        required: false
        type: boolean
      enable-test:
        default: true
        required: false
        type: boolean
      github-pages-artifact-name:
        default: github-pages
        required: false
        type: string
      github-pages-path:
        default: ./lib/github-pages
        required: false
        type: string
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:

# Mixed-mode policy decision: do not split this workflow.
# Rationale: the same build/test graph is reused across modes.
# Caller permissions are the security upper bound and must be explicit.
#
# Approved caller permission profiles:
#
# Profile A (standard CI callers):
# permissions:
#   contents: read
#   packages: read
#
# TODO: Remove this legacy CodeQL caller profile after callers migrate to .github/workflows/codeql.yaml.
# Profile B (CodeQL callers):
# permissions:
#   actions: read
#   contents: read
#   packages: read
#   security-events: write

concurrency:
  cancel-in-progress: false
  group: continuous-integration-${{ github.repository }}-${{ inputs.ref }}

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: discover container:build targets
        id: discover-build-containers
        uses: escapace/workflows/.github/actions/discover-containers@trunk
        with:
          dockerfile-name: ${{ inputs.container-dockerfile-name }}
          required-script-name: ${{ inputs.container-build-required-script-name }}
          required-target: build
      - name: discover container:export targets
        id: discover-export-containers
        uses: escapace/workflows/.github/actions/discover-containers@trunk
        with:
          dockerfile-name: ${{ inputs.container-dockerfile-name }}
          required-script-name: ${{ inputs.container-export-required-script-name }}
          required-target: export
      - name: discover container:test targets
        id: discover-test-containers
        uses: escapace/workflows/.github/actions/discover-containers@trunk
        with:
          dockerfile-name: ${{ inputs.container-dockerfile-name }}
          required-script-name: ${{ inputs.container-test-required-script-name }}
          required-target: test
      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: write .npmrc
        if: inputs.enable-github-packages-npm-registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << EOF > "$HOME/.npmrc"
            //npm.pkg.github.com/:_authToken=$GITHUB_TOKEN
            @escapace:registry=https://npm.pkg.github.com
          EOF
      - name: install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false
          version: ${{ inputs.pnpm-version }}
      - name: setup socket firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          job-summary: errors
          mode: firewall-free
      - name: get pnpm store directory
        id: pnpm-store-path
        run: echo "value=$(pnpm store path)" >> $GITHUB_OUTPUT
      # Disable shared dependency caches when this CI run is producing an
      # artifact that a later release/deploy job will publish.
      - name: pnpm cache
        if: ${{ !(inputs.enable-artifact-upload || inputs.enable-github-pages) }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store-path.outputs.value }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store
      - name: install the latest version of uv
        if: ${{ hashFiles('pyproject.toml') != '' && hashFiles('uv.lock') != '' }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            **/pyproject.toml
          enable-cache: ${{ !(inputs.enable-artifact-upload || inputs.enable-github-pages) }}
          ignore-nothing-to-cache: true
          version: 'latest'
      # TODO: Run uv directly until sfw-free stops breaking uv commands:
      # https://github.com/SocketDev/sfw-free/issues/30
      - name: install python dependencies
        if: ${{ hashFiles('pyproject.toml') != '' && hashFiles('uv.lock') != '' }}
        run: uv sync --locked
      - name: install dependencies
        run: sfw pnpm install
      - name: run container:export:before hook
        if: steps.discover-export-containers.outputs.has-containers == 'true'
        run: pnpm run --if-present container:export:before
      - name: bake container:export targets
        if: steps.discover-export-containers.outputs.has-containers == 'true'
        uses: escapace/workflows/.github/actions/bake-containers@trunk
        with:
          build-args: |
            ENABLE_GITHUB_PACKAGES_NPM_REGISTRY=${{ inputs.enable-github-packages-npm-registry }}
            NODE_VERSION=${{ inputs.node-version }}
            PNPM_VERSION=${{ inputs.pnpm-version }}
            VERSION=${{ inputs.version }}
          cache: ${{ !(inputs.enable-artifact-upload || inputs.enable-github-pages) }}
          containers: ${{ steps.discover-export-containers.outputs.containers }}
          export-directory: .
      - name: run container:export:after hook
        if: steps.discover-export-containers.outputs.has-containers == 'true'
        run: pnpm run --if-present container:export:after
      - name: build
        run: pnpm run build
      - name: typecheck
        run: pnpm run typecheck
      - name: test
        if: inputs.enable-test
        run: pnpm run test
      - name: run container:build:before hook
        if: steps.discover-build-containers.outputs.has-containers == 'true'
        run: pnpm run --if-present container:build:before
      - name: bake container:build targets
        if: steps.discover-build-containers.outputs.has-containers == 'true'
        uses: escapace/workflows/.github/actions/bake-containers@trunk
        with:
          build-args: |
            ENABLE_GITHUB_PACKAGES_NPM_REGISTRY=${{ inputs.enable-github-packages-npm-registry }}
            NODE_VERSION=${{ inputs.node-version }}
            PNPM_VERSION=${{ inputs.pnpm-version }}
            VERSION=${{ inputs.version }}
          cache: ${{ !(inputs.enable-artifact-upload || inputs.enable-github-pages) }}
          containers: ${{ steps.discover-build-containers.outputs.containers }}
      - name: run container:build:after hook
        if: steps.discover-build-containers.outputs.has-containers == 'true'
        run: pnpm run --if-present container:build:after
      - name: run container:test:before hook
        if: inputs.enable-test && steps.discover-test-containers.outputs.has-containers == 'true'
        run: pnpm run --if-present container:test:before
      - name: bake container:test targets
        if: inputs.enable-test && steps.discover-test-containers.outputs.has-containers == 'true'
        uses: escapace/workflows/.github/actions/bake-containers@trunk
        with:
          build-args: |
            ENABLE_GITHUB_PACKAGES_NPM_REGISTRY=${{ inputs.enable-github-packages-npm-registry }}
            NODE_VERSION=${{ inputs.node-version }}
            PNPM_VERSION=${{ inputs.pnpm-version }}
            VERSION=${{ inputs.version }}
          cache: ${{ !(inputs.enable-artifact-upload || inputs.enable-github-pages) }}
          containers: ${{ steps.discover-test-containers.outputs.containers }}
      - name: run container:test:after hook
        if: inputs.enable-test && steps.discover-test-containers.outputs.has-containers == 'true'
        run: pnpm run --if-present container:test:after
      - name: codeql init
        if: inputs.enable-codeql
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          build-mode: none
          languages: ${{ inputs.codeql-languages }}
      - name: codeql analysis
        if: inputs.enable-codeql
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      - name: code coverage
        if: inputs.enable-codecov && inputs.enable-test
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: pnpm pack
        if: inputs.enable-artifact-upload
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: pnpm run pack --version "${PACKAGE_VERSION}"
      - name: upload artifact
        if: inputs.enable-artifact-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            **/lib/*.tgz
            !**/node_modules/**
          retention-days: 1
      - name: build github-pages
        if: inputs.enable-github-pages
        run: pnpm run build:github-pages --base "/${GITHUB_REPOSITORY#*/}/"
      - name: upload github-pages
        if: inputs.enable-github-pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ inputs.github-pages-artifact-name }}
          path: ${{ inputs.github-pages-path }}
          retention-days: 1
