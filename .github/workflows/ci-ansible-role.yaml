on:
  workflow_call:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  # TODO: Use inputs.ref once ansible-role callers pass the normalized context ref.
  group: continuous-integration-${{ github.repository }}-${{ github.ref }}

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: docker login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive
      - name: install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          enable-cache: true
          ignore-nothing-to-cache: true
          version: 'latest'
      - name: setup socket firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          job-summary: errors
          mode: firewall-free
      # TODO: Run uv directly until sfw-free stops breaking uv commands:
      # https://github.com/SocketDev/sfw-free/issues/30
      - name: run molecule test
        run: |
          uv sync
          source .venv/bin/activate
          molecule test
