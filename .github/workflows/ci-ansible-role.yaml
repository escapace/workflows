on:
  workflow_call:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  # TODO: Use inputs.ref once ansible-role callers pass the normalized context ref.
  group: continuous-integration-${{ github.repository }}-${{ github.ref }}

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: docker login
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: install the latest version of uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          enable-cache: true
          ignore-nothing-to-cache: true
          version: 'latest'
      - name: setup socket firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          job-summary: errors
          mode: firewall-free
      # TODO: Run uv directly until sfw-free stops breaking uv commands:
      # https://github.com/SocketDev/sfw-free/issues/30
      - name: run molecule test
        run: |
          uv sync
          source .venv/bin/activate
          molecule test
