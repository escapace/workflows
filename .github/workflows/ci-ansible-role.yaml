on:
  workflow_call:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  # TODO: Use inputs.ref once ansible-role callers pass the normalized context ref.
  group: continuous-integration-${{ github.repository }}-${{ github.ref }}

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: docker login
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          enable-cache: true
          ignore-nothing-to-cache: true
          version: 'latest'
      - name: setup socket firewall
        uses: SocketDev/action@v1.3.2
        with:
          job-summary: errors
          mode: firewall-free
      - name: run molecule test
        run: |
          sfw uv sync
          source .venv/bin/activate
          molecule test
