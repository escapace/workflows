name: bake containers

description: build discovered containers with docker bake into local output directories

inputs:
  build-args:
    description: Multiline Docker build arguments in KEY=VALUE form applied to every baked container
    default: ''
    required: false
  cache:
    description: Cache backends to enable. Canonical values are gha and mounts. Accepts true for gha only, false for no container cache, or a comma- or newline-delimited list containing gha and/or mounts.
    default: gha
    required: false
  cache-ignore-error:
    description: Whether Bake gha layer-cache export errors should be ignored when gha cache is enabled.
    default: 'false'
    required: false
  cache-key:
    description: Optional additional partition key for persisted mount caches. Use this to separate RUN --mount=type=cache state across workflow contexts that should not share it.
    default: ''
    required: false
  cache-mode:
    description: Bake gha layer-cache export mode when gha cache is enabled (min or max).
    default: max
    required: false
  cache-scope:
    description: Scope prefix used to derive per-target Bake gha cache scopes when gha cache is enabled.
    default: buildkit
    required: false
  containers:
    description: JSON array from discover-containers
    required: true
  export-directory:
    description: Optional workspace-relative directory to receive copied exported build results. Use '.' for the workspace root. When empty, no export copy is performed.
    default: ''
    required: false
  platforms:
    description: Optional comma- or newline-delimited list of supported platforms (linux/amd64, linux/arm64). Defaults to the native runner platform.
    default: ''
    required: false

outputs:
  bake-file:
    description: Generated Bake JSON definition path
    value: ${{ steps.plan.outputs.bake-file }}
  containers:
    description: JSON array of planned baked containers including output directories
    value: ${{ steps.plan.outputs.containers }}
  count:
    description: Number of baked container targets
    value: ${{ steps.plan.outputs.count }}
  has-containers:
    description: Whether any container targets were baked
    value: ${{ steps.plan.outputs.has-containers }}
  metadata:
    description: docker/bake-action metadata JSON
    value: ${{ steps.bake.outputs.metadata }}
  output-root:
    description: Absolute temporary root directory used for Buildx local exports when exports are enabled; otherwise empty.
    value: ${{ steps.plan.outputs.output-root }}
  platforms:
    description: JSON array of normalized target platforms
    value: ${{ steps.plan.outputs.platforms }}
  qemu-platforms:
    description: Comma-delimited non-native architectures to install in QEMU
    value: ${{ steps.plan.outputs.qemu-platforms }}

runs:
  using: composite
  steps:
    - name: plan baked container build
      id: plan
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
        CACHE: ${{ inputs.cache }}
        CACHE_IGNORE_ERROR: ${{ inputs.cache-ignore-error }}
        CACHE_MODE: ${{ inputs.cache-mode }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        CONTAINERS: ${{ inputs.containers }}
        EXPORT_DIRECTORY: ${{ inputs.export-directory }}
        GITHUB_TOKEN: ${{ github.token }}
        PLATFORMS_INPUT: ${{ inputs.platforms }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('node:fs')
          const os = require('node:os')
          const path = require('node:path')

          const parseBooleanEnv = (value, name) => {
            if (value === 'true' || value === 'True' || value === 'TRUE') {
              return true
            }

            if (value === 'false' || value === 'False' || value === 'FALSE') {
              return false
            }

            throw new Error(`Expected ${name} to use YAML 1.2 boolean syntax, received: ${value}`)
          }
          const splitMultilineEnv = (value) => (value ?? '').split(/\r?\n/).filter((line) => line !== '')
          const parseCacheModes = (value) => {
            const trimmedValue = (value ?? '').trim()

            if (trimmedValue.length === 0) {
              return ['gha']
            }

            try {
              return parseBooleanEnv(trimmedValue, 'cache') ? ['gha'] : []
            } catch {
              const allowedModes = new Set(['gha', 'mounts'])
              const parsedModes = splitMultilineEnv(value)
                .flatMap((line) => line.split(','))
                .map((mode) => mode.trim())
                .filter((mode, index, all) => mode.length > 0 && all.indexOf(mode) === index)

              for (const mode of parsedModes) {
                if (allowedModes.has(mode) === false) {
                  throw new Error(`Unsupported cache mode: ${mode}`)
                }
              }

              return parsedModes
            }
          }
          const containers = JSON.parse(process.env.CONTAINERS)

          if (!Array.isArray(containers)) {
            throw new Error('Expected containers input to be a JSON array.')
          }

          const workspace = process.env.GITHUB_WORKSPACE

          if (typeof workspace !== 'string' || workspace.length === 0) {
            throw new Error('Expected GITHUB_WORKSPACE to be set.')
          }

          const exportDirectoryInput = (process.env.EXPORT_DIRECTORY ?? '').trim()
          const exportDirectory = (() => {
            if (exportDirectoryInput.length === 0) {
              return ''
            }

            if (path.isAbsolute(exportDirectoryInput)) {
              throw new Error(`Expected export-directory to be workspace-relative, received absolute path: ${exportDirectoryInput}`)
            }

            const resolvedExportDirectory = path.resolve(workspace, exportDirectoryInput)
            const relativeExportDirectory = path.relative(workspace, resolvedExportDirectory)

            if (relativeExportDirectory.startsWith('..') || path.isAbsolute(relativeExportDirectory)) {
              throw new Error(`Expected export-directory to stay within the workspace root: ${exportDirectoryInput}`)
            }

            return resolvedExportDirectory
          })()
          const cacheModes = parseCacheModes(process.env.CACHE)
          const ghaCacheEnabled = cacheModes.includes('gha')
          const persistedMountCacheEnabled = cacheModes.includes('mounts')
          const cacheScope = (process.env.CACHE_SCOPE ?? '').trim()
          const cacheMode = (process.env.CACHE_MODE ?? '').trim()
          const cacheIgnoreError = ghaCacheEnabled
            ? parseBooleanEnv(process.env.CACHE_IGNORE_ERROR, 'cache-ignore-error')
            : false
          const githubToken = process.env.GITHUB_TOKEN ?? ''
          const architectureByProcessArch = {
            arm64: 'arm64',
            x64: 'amd64',
          }
          const supportedPlatforms = new Set(['linux/amd64', 'linux/arm64'])
          const requestedPlatforms = splitMultilineEnv(process.env.PLATFORMS_INPUT)
            .flatMap((platform) => platform.split(','))
            .map((platform) => platform.trim())
            .filter((platform, index, all) => platform.length > 0 && all.indexOf(platform) === index)

          const buildArgLines = splitMultilineEnv(process.env.BUILD_ARGS)
          const nativeArchitecture = architectureByProcessArch[process.arch]
          const parseCanonicalBuildArgs = (lines) => {
            const buildArgs = new Map()

            for (const line of lines) {
              const separatorIndex = line.indexOf('=')

              if (separatorIndex <= 0) {
                throw new Error(`Expected build-args lines in KEY=VALUE form, received: ${line}`)
              }

              const key = line.slice(0, separatorIndex).trim()
              const value = line.slice(separatorIndex + 1)

              if (key.length === 0) {
                throw new Error(`Expected a non-empty build argument key in line: ${line}`)
              }

              buildArgs.set(key, value)
            }

            return [...buildArgs.entries()].sort(([leftKey], [rightKey]) => leftKey.localeCompare(rightKey))
          }
          const deriveContainerBuildArgs = (container, canonicalProvidedBuildArgs) => {
            const declaredArgNames = new Set(container.args.map((arg) => arg.name))
            const effectiveBuildArgs = new Map(
              canonicalProvidedBuildArgs.filter(([key]) => declaredArgNames.has(key)),
            )

            if (declaredArgNames.has('TARGET')) {
              effectiveBuildArgs.set('TARGET', typeof container.target === 'string' ? container.target : '')
            }

            return Object.fromEntries(
              [...effectiveBuildArgs.entries()].sort(([leftKey], [rightKey]) => leftKey.localeCompare(rightKey)),
            )
          }

          if (ghaCacheEnabled && cacheMode !== 'min' && cacheMode !== 'max') {
            throw new Error(`Expected cache-mode to be min or max, received: ${cacheMode}`)
          }

          if (typeof nativeArchitecture !== 'string') {
            throw new Error(`Unsupported runner architecture for bake containers: ${process.arch}`)
          }

          const nativePlatform = `linux/${nativeArchitecture}`
          const platforms = requestedPlatforms.length > 0 ? requestedPlatforms : [nativePlatform]

          for (const platform of platforms) {
            if (supportedPlatforms.has(platform) === false) {
              throw new Error(`Unsupported platform: ${platform}`)
            }
          }

          const qemuPlatforms = platforms
            .map((platform) => platform.split('/')[1])
            .filter((architecture, index, all) => architecture !== nativeArchitecture && all.indexOf(architecture) === index)
          const canonicalProvidedBuildArgs = parseCanonicalBuildArgs(buildArgLines)

          const deriveBakeGhaCacheScope = (scopePrefix, container) => {
            const targetName = typeof container.target === 'string' ? container.target : 'dockerfile-default'

            return [scopePrefix, container.id, targetName].filter((segment) => segment.length > 0).join('--')
          }
          const validatedContainers = containers.map((container, index) => {
            if (container === null || typeof container !== 'object' || Array.isArray(container)) {
              throw new Error(`Expected containers[${index}] to be a JSON object.`)
            }

            for (const key of ['context', 'dockerfile', 'id', 'name', 'package-directory', 'package-name']) {
              if (typeof container[key] !== 'string' || container[key].length === 0) {
                throw new Error(`Expected containers[${index}].${key} to be a non-empty string.`)
              }
            }

            if (!Array.isArray(container.stages) || container.stages.some((stage) => typeof stage !== 'string')) {
              throw new Error(`Expected containers[${index}].stages to be an array of strings.`)
            }

            if (
              !Array.isArray(container.args) ||
              container.args.some(
                (arg) =>
                  arg === null ||
                  typeof arg !== 'object' ||
                  Array.isArray(arg) ||
                  typeof arg.name !== 'string' ||
                  arg.name.length === 0 ||
                  (arg.defaultValue !== null && typeof arg.defaultValue !== 'string') ||
                  Number.isInteger(arg.line) === false ||
                  arg.line < 1,
              )
            ) {
              throw new Error(`Expected containers[${index}].args to be an array of ARG declarations.`)
            }

            if (
              'target' in container &&
              container.target !== undefined &&
              (typeof container.target !== 'string' || container.target.length === 0)
            ) {
              throw new Error(`Expected containers[${index}].target to be undefined or a non-empty string.`)
            }

            if (typeof container.target === 'string' && container.stages.includes(container.target) === false) {
              throw new Error(`Expected containers[${index}].stages to include target ${container.target}.`)
            }

            return {
              ...container,
              args: container.args.map((arg) => ({
                defaultValue: arg.defaultValue,
                line: arg.line,
                name: arg.name,
              })),
            }
          })
          const hasExportTargets = validatedContainers.some((container) => container.target === 'export')
          const exportsEnabled = exportDirectory.length > 0 && hasExportTargets
          const outputRoot = exportsEnabled
            ? fs.mkdtempSync(path.join(process.env.RUNNER_TEMP ?? os.tmpdir(), 'bake-containers-output-'))
            : ''
          const plannedContainers = validatedContainers.map((container) => ({
            ...container,
            buildArgs: deriveContainerBuildArgs(container, canonicalProvidedBuildArgs),
            'output-directory': exportsEnabled ? path.join(outputRoot, container['package-directory']) : '',
          }))

          const bakeDefinition = {
            group: {
              default: {
                targets: plannedContainers.map((container) => container.id),
              },
            },
            target: Object.fromEntries(
              plannedContainers.map((container) => {
                const ghaCacheScopeName = ghaCacheEnabled ? deriveBakeGhaCacheScope(cacheScope, container) : undefined
                const ghaCacheEntry = ghaCacheEnabled
                  ? {
                      type: 'gha',
                      scope: ghaCacheScopeName,
                      mode: cacheMode,
                      ...(cacheIgnoreError ? { 'ignore-error': true } : {}),
                      ...(githubToken.length > 0
                        ? {
                            ghtoken: githubToken,
                            repository: process.env.GITHUB_REPOSITORY,
                          }
                        : {}),
                    }
                  : undefined

                return [
                  container.id,
                  {
                    ...(Object.keys(container.buildArgs).length > 0 ? { args: container.buildArgs } : {}),
                    ...(ghaCacheScopeName === undefined ? {} : { 'cache-from': [{ scope: ghaCacheScopeName, type: 'gha' }] }),
                    ...(ghaCacheEntry === undefined ? {} : { 'cache-to': [ghaCacheEntry] }),
                    context: container.context,
                    dockerfile: container.dockerfile,
                    ...(exportsEnabled && container.target === 'export'
                      ? { output: [{ dest: container['output-directory'], type: 'local' }] }
                      : {}),
                    platforms,
                    ...(typeof container.target === 'string' ? { target: container.target } : {}),
                  },
                ]
              }),
            ),
          }
          const tempDirectory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP ?? os.tmpdir(), 'bake-containers-'))
          const bakeFile = path.join(tempDirectory, 'docker-bake.json')
          const planFile = path.join(tempDirectory, 'containers.json')

          if (exportsEnabled) {
            fs.mkdirSync(outputRoot, { recursive: true })
          }
          fs.writeFileSync(bakeFile, JSON.stringify(bakeDefinition, null, 2))
          fs.writeFileSync(planFile, JSON.stringify(plannedContainers, null, 2))

          core.setOutput('bake-file', bakeFile)
          core.setOutput('containers', JSON.stringify(plannedContainers))
          core.setOutput('count', String(plannedContainers.length))
          core.setOutput('export-directory', exportDirectory)
          core.setOutput('exports-enabled', exportsEnabled ? 'true' : 'false')
          core.setOutput('has-containers', plannedContainers.length > 0 ? 'true' : 'false')
          core.setOutput('persisted-mount-cache-enabled', persistedMountCacheEnabled ? 'true' : 'false')
          core.setOutput('output-root', outputRoot)
          core.setOutput('plan-file', planFile)
          core.setOutput('platforms', JSON.stringify(platforms))
          core.setOutput('qemu-platforms', qemuPlatforms.join(','))

    - name: setup qemu
      if: steps.plan.outputs.has-containers == 'true' && steps.plan.outputs.qemu-platforms != ''
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
      with:
        platforms: ${{ steps.plan.outputs.qemu-platforms }}

    - name: docker buildx
      if: steps.plan.outputs.has-containers == 'true'
      id: buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: install dockerfile-tools
      if: steps.plan.outputs.has-containers == 'true'
      uses: escapace/action-dockerfile-tools@v0.2.1

    - name: discover cache mounts and derive cache keys
      if: steps.plan.outputs.has-containers == 'true' && steps.plan.outputs.persisted-mount-cache-enabled == 'true'
      id: cache-plan
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
        PLAN_FILE: ${{ steps.plan.outputs.plan-file }}
        PLATFORMS: ${{ steps.plan.outputs.platforms }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { createHash } = require('node:crypto')
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')
          const os = require('node:os')
          const path = require('node:path')

          const sha256 = (value) => createHash('sha256').update(value).digest('hex')
          const sha256Json = (value) => sha256(JSON.stringify(value))
          const architectureByProcessArch = {
            arm64: 'arm64',
            x64: 'amd64',
          }
          const parsePlatform = (platform) => {
            const [os, architecture, variant = ''] = platform.split('/')

            if (typeof os !== 'string' || os.length === 0 || typeof architecture !== 'string' || architecture.length === 0) {
              throw new Error(`Expected platform to be in os/arch[/variant] form, received: ${platform}`)
            }

            return {
              architecture,
              os,
              platform,
              variant,
            }
          }
          const toCanonicalBuildArgEntries = (buildArgs) => Object.entries(buildArgs).sort(
            ([leftKey], [rightKey]) => leftKey.localeCompare(rightKey),
          )
          const toCanonicalCacheOptionEntries = (cacheOptions) => Object.entries(cacheOptions).sort(
            ([leftKey], [rightKey]) => leftKey.localeCompare(rightKey),
          )
          const toCanonicalCacheOptions = (cacheOptions) => Object.fromEntries(
            toCanonicalCacheOptionEntries(cacheOptions),
          )
          const toCanonicalCacheOptionsFingerprint = (cacheOptions) => JSON.stringify(
            toCanonicalCacheOptionEntries(cacheOptions),
          )
          const describeCacheCollisionOrigin = (origin) => {
            const targetName = origin.target.length > 0 ? origin.target : 'dockerfile-default'

            return `${origin.containerId} (${origin.dockerfile}, target ${targetName}, platform ${origin.platform})`
          }
          const describeCacheCollisionVariant = (variant, logicalSourcePath) => {
            const effectiveIdentity = typeof variant.cacheOptions.id === 'string' && variant.cacheOptions.id.length > 0
              ? variant.cacheOptions.id
              : variant.cacheOptions.target

            if (typeof effectiveIdentity !== 'string' || effectiveIdentity.length === 0) {
              throw new Error(`Expected cache mount ${logicalSourcePath} to include an id or target.`)
            }

            const identitySource = typeof variant.cacheOptions.id === 'string' && variant.cacheOptions.id.length > 0 ? 'id' : 'target'

            return `${identitySource}=${JSON.stringify(effectiveIdentity)} from ${variant.origins.map(describeCacheCollisionOrigin).join(', ')}`
          }
          const warnOnLogicalCacheCollisions = (logicalCacheEntries) => {
            for (const [logicalSourcePath, logicalCacheEntry] of logicalCacheEntries.entries()) {
              if (logicalCacheEntry.variants.size < 2) {
                continue
              }

              core.warning(
                [
                  `Detected conflicting cache mount definitions for ${logicalSourcePath}; keeping the last discovered definition.`,
                  ...[...logicalCacheEntry.variants.values()].map(
                    (variant, index) =>
                      `Variant ${index + 1}: ${describeCacheCollisionVariant(variant, logicalSourcePath)}`,
                  ),
                  `Retained: ${describeCacheCollisionOrigin(logicalCacheEntry.retained.origin)}.`,
                ].join('\n'),
              )
            }
          }
          const discoverLogicalCacheMap = (containers, buildPlatform, targetPlatforms) => {
            const logicalCacheEntries = new Map()

            for (const container of containers) {
              const dockerfileToolArgLines = toCanonicalBuildArgEntries(container.buildArgs).map(
                ([key, value]) => `${key}=${value}`,
              )

              for (const targetPlatform of targetPlatforms) {
                const args = [
                  'list-cache-mounts',
                  '--dockerfile',
                  container.dockerfile,
                  ...dockerfileToolArgLines.flatMap((line) => ['--arg', line]),
                  '--arg',
                  `BUILDPLATFORM=${buildPlatform.platform}`,
                  '--arg',
                  `BUILDOS=${buildPlatform.os}`,
                  '--arg',
                  `BUILDARCH=${buildPlatform.architecture}`,
                  '--arg',
                  `BUILDVARIANT=${buildPlatform.variant}`,
                  '--arg',
                  `TARGETPLATFORM=${targetPlatform.platform}`,
                  '--arg',
                  `TARGETOS=${targetPlatform.os}`,
                  '--arg',
                  `TARGETARCH=${targetPlatform.architecture}`,
                  '--arg',
                  `TARGETVARIANT=${targetPlatform.variant}`,
                ]
                const cacheMap = JSON.parse(execFileSync('dockerfile-tools', args, { encoding: 'utf8' }))

                if (cacheMap === null || typeof cacheMap !== 'object' || Array.isArray(cacheMap)) {
                  throw new Error(`Expected dockerfile-tools list-cache-mounts to return a JSON object for ${container.dockerfile}`)
                }

                for (const [logicalSourcePath, cacheOptions] of Object.entries(cacheMap)) {
                  if (cacheOptions === null || typeof cacheOptions !== 'object' || Array.isArray(cacheOptions)) {
                    throw new Error(`Expected cache mount ${logicalSourcePath} from ${container.dockerfile} to be a JSON object.`)
                  }

                  const { type: _type, ...rawNormalizedCacheOptions } = cacheOptions
                  const normalizedCacheOptions = toCanonicalCacheOptions(rawNormalizedCacheOptions)

                  if (typeof normalizedCacheOptions.target !== 'string' || normalizedCacheOptions.target.length === 0) {
                    throw new Error(`Expected cache mount ${logicalSourcePath} from ${container.dockerfile} to include a target.`)
                  }

                  const origin = {
                    containerId: container.id,
                    dockerfile: container.dockerfile,
                    platform: targetPlatform.platform,
                    target: typeof container.target === 'string' ? container.target : '',
                  }
                  const fingerprint = toCanonicalCacheOptionsFingerprint(normalizedCacheOptions)
                  const logicalCacheEntry = logicalCacheEntries.get(logicalSourcePath) ?? {
                    retained: undefined,
                    variants: new Map(),
                  }
                  const variant = logicalCacheEntry.variants.get(fingerprint) ?? {
                    cacheOptions: normalizedCacheOptions,
                    origins: [],
                  }

                  variant.origins.push(origin)
                  logicalCacheEntry.variants.set(fingerprint, variant)
                  logicalCacheEntry.retained = {
                    cacheOptions: normalizedCacheOptions,
                    origin,
                  }
                  logicalCacheEntries.set(logicalSourcePath, logicalCacheEntry)
                }
              }
            }

            warnOnLogicalCacheCollisions(logicalCacheEntries)

            return Object.fromEntries(
              [...logicalCacheEntries.entries()].map(([logicalSourcePath, logicalCacheEntry]) => [
                logicalSourcePath,
                logicalCacheEntry.retained.cacheOptions,
              ]),
            )
          }
          const toPhysicalCacheMap = (logicalCacheMap, cacheRoot) => Object.fromEntries(
            Object.entries(logicalCacheMap).map(([logicalSourcePath, cacheOptions]) => [
              path.join(cacheRoot, logicalSourcePath),
              cacheOptions,
            ]),
          )
          const toCanonicalCompatibilityBindings = (logicalCacheMap) => ({
            bindings: Object.entries(logicalCacheMap)
              .map(([logicalSourcePath, cacheOptions]) => {
                if (typeof cacheOptions === 'string') {
                  return {
                    effectiveIdentity: cacheOptions,
                    sourcePath: logicalSourcePath,
                  }
                }

                const effectiveIdentity = typeof cacheOptions.id === 'string' && cacheOptions.id.length > 0
                  ? cacheOptions.id
                  : cacheOptions.target

                if (typeof effectiveIdentity !== 'string' || effectiveIdentity.length === 0) {
                  throw new Error(`Expected cache mount ${logicalSourcePath} to include an id or target.`)
                }

                return {
                  effectiveIdentity,
                  sourcePath: logicalSourcePath,
                }
              })
              .sort((left, right) => left.sourcePath.localeCompare(right.sourcePath) || left.effectiveIdentity.localeCompare(right.effectiveIdentity)),
          })
          const toCanonicalTargetSelections = (containers) => containers
            .map((container) => ({
              id: container.id,
              target: typeof container.target === 'string' ? container.target : 'dockerfile-default',
            }))
            .sort((left, right) => left.id.localeCompare(right.id) || left.target.localeCompare(right.target))
          const toCanonicalContainerBuildArgs = (containers) => containers
            .map((container) => ({
              buildArgs: toCanonicalBuildArgEntries(container.buildArgs),
              id: container.id,
            }))
            .sort((left, right) => left.id.localeCompare(right.id))

          const planFile = process.env.PLAN_FILE
          const platforms = JSON.parse(process.env.PLATFORMS)
          const nativeArchitecture = architectureByProcessArch[process.arch]

          if (typeof nativeArchitecture !== 'string') {
            throw new Error(`Unsupported runner architecture for cache planning: ${process.arch}`)
          }

          const buildPlatform = parsePlatform(`linux/${nativeArchitecture}`)
          const targetPlatforms = platforms.map(parsePlatform)
          const containers = JSON.parse(fs.readFileSync(planFile, 'utf8'))
          const callerCacheKey = process.env.CACHE_KEY ?? ''
          const dockerfiles = [...new Set(containers.map((container) => container.dockerfile))].sort()
          const canonicalContainerBuildArgs = toCanonicalContainerBuildArgs(containers)
          const logicalCacheMap = discoverLogicalCacheMap(containers, buildPlatform, targetPlatforms)
          const canonicalCompatibilityBindings = toCanonicalCompatibilityBindings(logicalCacheMap)
          const canonicalTargetSelections = toCanonicalTargetSelections(containers)
          const dockerfileHashes = dockerfiles.map((dockerfile) => ({
            contentHash: sha256(fs.readFileSync(path.resolve(dockerfile))),
            path: dockerfile,
          }))
          const compatibilityHash = sha256Json(canonicalCompatibilityBindings)
          const targetHash = sha256Json(canonicalTargetSelections)
          const callerCacheKeyHash = sha256(callerCacheKey)
          const freshnessHash = sha256Json({
            buildArgs: canonicalContainerBuildArgs,
            dockerfiles: dockerfileHashes,
          })
          const runnerTempDirectory = process.env.RUNNER_TEMP ?? os.tmpdir()
          const cacheRoot = path.join(
            runnerTempDirectory,
            'bake-containers-cache',
            compatibilityHash,
            targetHash,
            callerCacheKeyHash,
          )
          const physicalCacheMap = toPhysicalCacheMap(logicalCacheMap, cacheRoot)
          const cachePaths = Object.keys(physicalCacheMap).sort()
          const scratchDirectory = path.join(
            runnerTempDirectory,
            'bake-containers-scratch',
            compatibilityHash,
            targetHash,
            callerCacheKeyHash,
          )

          core.setOutput('caller-cache-key-hash', callerCacheKeyHash)
          core.setOutput('cache-map', JSON.stringify(physicalCacheMap))
          core.setOutput('cache-path', cachePaths.join('\n'))
          core.setOutput('compatibility-hash', compatibilityHash)
          core.setOutput('freshness-hash', freshnessHash)
          core.setOutput('has-cache-paths', cachePaths.length > 0 ? 'true' : 'false')
          core.setOutput('scratch-dir', scratchDirectory)
          core.setOutput('target-hash', targetHash)

    - name: restore mount cache
      if: steps.plan.outputs.has-containers == 'true' && steps.plan.outputs.persisted-mount-cache-enabled == 'true' && steps.cache-plan.outputs.has-cache-paths == 'true'
      id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: cache-mounts-${{ steps.cache-plan.outputs.compatibility-hash }}-${{ steps.cache-plan.outputs.target-hash }}-${{ steps.cache-plan.outputs.caller-cache-key-hash }}-${{ steps.cache-plan.outputs.freshness-hash }}
        path: |
          ${{ steps.cache-plan.outputs.cache-path }}
        restore-keys: |
          cache-mounts-${{ steps.cache-plan.outputs.compatibility-hash }}-${{ steps.cache-plan.outputs.target-hash }}-${{ steps.cache-plan.outputs.caller-cache-key-hash }}-
          cache-mounts-${{ steps.cache-plan.outputs.compatibility-hash }}-${{ steps.cache-plan.outputs.target-hash }}-
          cache-mounts-${{ steps.cache-plan.outputs.compatibility-hash }}-

    - name: inject cache into docker
      if: steps.plan.outputs.has-containers == 'true' && steps.plan.outputs.persisted-mount-cache-enabled == 'true' && steps.cache-plan.outputs.has-cache-paths == 'true'
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        cache-map: ${{ steps.cache-plan.outputs.cache-map }}
        scratch-dir: ${{ steps.cache-plan.outputs.scratch-dir }}
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}

    - name: bake containers
      if: steps.plan.outputs.has-containers == 'true'
      id: bake
      uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        files: ${{ steps.plan.outputs.bake-file }}
        github-token: ${{ github.token }}
        source: .

    - name: copy exported build results
      if: steps.plan.outputs.has-containers == 'true' && steps.plan.outputs.exports-enabled == 'true'
      shell: bash
      env:
        EXPORT_DIRECTORY: ${{ steps.plan.outputs.export-directory }}
        OUTPUT_ROOT: ${{ steps.plan.outputs.output-root }}
      run: |
        set -euo pipefail
        mkdir -p "$EXPORT_DIRECTORY"
        cp -a "$OUTPUT_ROOT"/. "$EXPORT_DIRECTORY"/
